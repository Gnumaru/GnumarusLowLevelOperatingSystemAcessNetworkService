# Gnumarus native-operations HTTP service (Ruby port) configuration.
#
# Optional key=value lines. Precedence (highest first):
#   CLI flag > GNUMARUS_* env var > stdin key=value lines > this file > default
#
# Recognised keys (also settable as GNUMARUS_HOST / GNUMARUS_PORT /
# GNUMARUS_TOKEN / GNUMARUS_NO_AUTH):
#   host    = 127.0.0.1     # loopback only (127.0.0.0/8, ::1 or localhost)
#   port    = 1423          # 1-65535
#   token   = <secret>      # API token; omitted => a random one is generated
#   no_auth = false         # true disables token checks entirely
